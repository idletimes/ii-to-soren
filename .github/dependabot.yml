version: 2

updates:
  # Python dependencies. The pip ecosystem at "/" picks up every
  # *requirements*.txt in the directory, so this covers both
  # requirements.txt and requirements-dev.txt.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    # Wait a week after a release before proposing it: a hijacked release is
    # usually spotted and pulled within days. Security fixes are not delayed.
    cooldown:
      default-days: 7
    groups:
      # One PR a week for the low-risk bumps; majors stay separate so
      # they can be reviewed (and reverted) on their own.
      python-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # Keep the actions used by the CI workflow current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    # Same one-week wait as for pip above.
    cooldown:
      default-days: 7
    # No group here: the workflow pins floating major tags (@v7), so patch and
    # minor releases never move the ref. The only PR this can raise is a major
    # bump, which is worth reviewing on its own anyway.
